[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "levelup-ai"
version = "0.1.0"
description = "RPG-style self-improvement platform with a QLoRA fine-tuned LLaMA 3.2 companion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Veera Venkat Sai Kondaiahpalpu" }]

# Runtime deps only. Training/GPU extras live in [project.optional-dependencies]
# so the API image stays small and CI doesn't pull CUDA wheels.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
# Fine-tuning / GPU inference. Install torch separately with the right CUDA index.
training = [
    "transformers>=4.46",
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "accelerate>=0.29",
    "datasets>=2.18",
    "trl>=0.8",
    "sentencepiece>=0.2",
]
voice = ["openai-whisper", "elevenlabs"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/veeravenkatsaikondaiahpalpu-hue/levelup-ai"
Portfolio = "https://portfolio-veeravenkatsaikondaiahpalpu-hues-projects.vercel.app"

[tool.setuptools]
# Explicit list beats auto-discovery here: data/ and scripts/ are one-off
# utilities, not part of the shipped package.
packages = [
    "api",
    "api.routes",
    "chatbot",
    "chatbot.guardrails",
    "chatbot.fine_tuning",
    "xp_engine",
    "sentiment",
    "anomaly_detection",
    "voice",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv*", "models", "data/raw", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 off: several files use aligned comment tables that read better long.
ignore = ["E501", "B008"]
